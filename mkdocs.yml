site_name: Prodinamik Engine v1.3
site_description: Product-Agnostic Pipeline Engine — Formal state machine, 3-tier validation, Raft consensus, plugin ecosystem, AI-native features
site_author: Yunus Güngör
site_url: https://yunusgungor.github.io/prodinamik-engine
repo_url: https://github.com/yunusgungor/prodinamik-engine
repo_name: yunusgungor/prodinamik-engine
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Yunus Güngör

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yunusgungor
    - icon: fontawesome/solid/envelope
      link: mailto:mail@yunusgungor.com
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
    - Profiles: getting-started/profiles.md
  - User Guide:
