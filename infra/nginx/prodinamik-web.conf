# ──────────────────────────────────────────────────
# Prodinamik Engine — Nginx Reverse Proxy Config
# Serves React SPA + proxies /api/* and /ws/* to FastAPI
# ──────────────────────────────────────────────────

upstream prodinamik-api-upstream {
    server prodinamik-api:8000;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Root ──
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;

    # ── API proxy (REST) ──
    location /api/ {
        proxy_pass http://prodinamik-api-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # ── WebSocket proxy ──
    location /ws/ {
        proxy_pass http://prodinamik-api-upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # Long-lived WebSocket
    }

    # ── Swagger docs ──
    location /docs {
        proxy_pass http://prodinamik-api-upstream;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://prodinamik-api-upstream;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://prodinamik-api-upstream;
        proxy_set_header Host $host;
    }

    # ── Health check (rewrite to actual API path) ──
    location = /healthz {
        proxy_pass http://prodinamik-api-upstream/api/v1/healthz;
        proxy_set_header Host $host;
    }

    # ── Static assets with caching ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Favicon & manifest ──
    location ~* \.(svg|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Service Worker (no cache) ──
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
