# ──────────────────────────────────────────────────
# Prodinamik Engine — Release Pipeline
# ──────────────────────────────────────────────────
# Trigger: git tag v*.*.* push
# Actions: test → build → publish to PyPI + GHCR
# ──────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v1.2.3)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Verify tag matches pyproject.toml ──
  check-version:
    name: ✅ Version check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔍 Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(python -c "import tomllib; data = tomllib.load(open('pyproject.toml', 'rb')); print(data['project']['version'])")
          echo "Tag: v$TAG_VERSION | pyproject.toml: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Version mismatch!"
            exit 1
          fi
          echo "✅ Versions match"

  # ── Full test suite ──
  test:
    name: 🧪 Test suite
    runs-on: ubuntu-latest
    needs: [check-version]

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"

      - name: 🧪 Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Publish to PyPI ──
  pypi:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test]
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Build package
        run: |
          pip install build
          python -m build

      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Publish Docker to GHCR ──
  docker:
    name: 🐳 Publish Docker image
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 🐳 Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ──
  github-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pypi, docker]

    steps:
      - uses: actions/checkout@v4

      - name: 📝 Generate changelog
        id: changelog
        uses: jaywcjlove/github-action-changelog-generator@v1

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Prodinamik Engine ${{ github.ref_name }}
          body: |
            ## Prodinamik Engine ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changelog }}

            ### 📦 Installation
            ```bash
            pip install prodinamik-engine
            # or
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
